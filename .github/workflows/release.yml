name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed release tag (for example v0.1.0)
        required: true
        type: string
      publish_mode:
        description: Stage for maintainer 2FA approval, or explicitly publish directly
        required: true
        default: stage
        type: choice
        options: [stage, direct]
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'NAMEWTA/wta-skills-hub'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH_MODE: ${{ inputs.publish_mode || 'stage' }}
    steps:
      - name: Validate existing stable tag name
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Use pinned npm with staged publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - name: Verify tag, commit, main ancestry and lock version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); const l=JSON.parse(fs.readFileSync("package-lock.json")); if (`v${p.version}` !== process.env.RELEASE_TAG || l.version !== p.version || l.packages[""].version !== p.version) throw new Error("tag/package/lock versions differ");'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run smoke:package -- --network
      - name: Build the exact publish artifact
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ env.RELEASE_TAG }}
          path: namewta-skills-hub-*.tgz
          retention-days: 30
      - name: Stage reviewed tarball using OIDC (not yet public)
        if: env.PUBLISH_MODE == 'stage'
        run: npm stage publish "namewta-skills-hub-${RELEASE_TAG#v}.tgz" --access public --provenance
      - name: Explicit direct publish using OIDC
        if: github.event_name == 'workflow_dispatch' && env.PUBLISH_MODE == 'direct'
        run: npm publish "namewta-skills-hub-${RELEASE_TAG#v}.tgz" --access public --provenance
