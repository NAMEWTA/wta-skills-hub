# 复制整段，替换原来的 prepend / append / delete。策略组：🔰 节点选择
# 日期：2026-09-29
#
# DOMAIN-KEYWORD 比 DOMAIN-SUFFIX 更宽：域名任意位置出现这段文字就命中。
# 品牌词用关键字。短词会误伤别的站，仍用后缀或精确域名，见文末那一组。
#
# 进程规则只在「这台电脑自己跑 Clash，并且开了 TUN」时生效。
# 配置里需要：find-process-mode: always
# 路由器上看不到本机进程名，那些流量靠后面的域名规则。
# 进程规则要写在域名规则前面，软件启动时临时出现的新地址才会进同一节点，
# 不会有一条走代理、一条直连，地区检测对不上。
#
# 进程名来自这台 Mac 上已安装的应用：
# Claude.app、ChatGPT.app（包名是 com.openai.codex，桌面版 Codex）、
# Cursor.app、Grok Bot.app，以及命令行 claude / codex / grok。
# 不用 Cursor* 这种通配：系统进程 CursorUIViewService 会被一起带走。

prepend:
  # ===== 原有 7 条，顺序不动 =====
  - 'DOMAIN-KEYWORD,microsoft,🔰 节点选择'
  - 'DOMAIN-KEYWORD,chatgpt,🔰 节点选择'
  - 'IP-CIDR,43.108.85.167/32,DIRECT'
  - 'DOMAIN-KEYWORD,openai,🔰 节点选择'
  - 'DOMAIN-KEYWORD,cursor,🔰 节点选择'
  - 'DOMAIN-KEYWORD,anthropic,🔰 节点选择'
  - 'DOMAIN-KEYWORD,claude,🔰 节点选择'

  # ===== 本机进程：Claude / Codex / ChatGPT / Cursor / Grok =====
  # 桌面应用整包。辅助进程（Helper、Renderer、GPU、Computer Use）都在包里
  - 'PROCESS-PATH-WILDCARD,*Claude.app*,🔰 节点选择'
  - 'PROCESS-PATH-WILDCARD,*ChatGPT.app*,🔰 节点选择'
  - 'PROCESS-PATH-WILDCARD,*Cursor.app*,🔰 节点选择'
  - 'PROCESS-PATH-WILDCARD,*Grok Bot.app*,🔰 节点选择'
  # 命令行。macOS 上 Claude Code 的可执行文件名是 claude；Codex 桌面还会拉起 codex、codex-code-mode-host
  - 'PROCESS-NAME-WILDCARD,claude*,🔰 节点选择'
  - 'PROCESS-NAME-WILDCARD,Claude*,🔰 节点选择'
  - 'PROCESS-NAME-WILDCARD,codex*,🔰 节点选择'
  - 'PROCESS-NAME-WILDCARD,Codex*,🔰 节点选择'
  - 'PROCESS-NAME,ChatGPT,🔰 节点选择'
  - 'PROCESS-NAME,ChatGPT.exe,🔰 节点选择'
  - 'PROCESS-NAME,grok,🔰 节点选择'
  - 'PROCESS-NAME,grok.exe,🔰 节点选择'
  - 'PROCESS-NAME-WILDCARD,Grok Bot*,🔰 节点选择'
  - 'PROCESS-NAME,Cursor,🔰 节点选择'
  - 'PROCESS-NAME,Cursor.exe,🔰 节点选择'
  - 'PROCESS-NAME,Cursor Helper,🔰 节点选择'
  - 'PROCESS-NAME,Cursor Helper (GPU),🔰 节点选择'
  - 'PROCESS-NAME,Cursor Helper (Plugin),🔰 节点选择'
  - 'PROCESS-NAME,Cursor Helper (Renderer),🔰 节点选择'
  # npm / 原生安装路径。node 本身不匹配，避免所有 Node 程序都被带走
  - 'PROCESS-PATH-WILDCARD,*claude-code*,🔰 节点选择'
  - 'PROCESS-PATH-WILDCARD,*@openai/codex*,🔰 节点选择'
  - 'PROCESS-PATH-WILDCARD,*@xai-official/grok*,🔰 节点选择'
  - 'PROCESS-NAME,SkyComputerUseClient,🔰 节点选择'
  - 'PROCESS-NAME,CUALockScreenGuardian,🔰 节点选择'

  # ===== 关键字：品牌词，用来接住以后新出现的子域名 =====
