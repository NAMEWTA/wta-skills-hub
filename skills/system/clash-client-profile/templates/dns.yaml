# Conservative review fragment, NOT a complete deployment configuration.
# Preserve the user's existing resolver, listen, fake-ip, bootstrap and policy choices.
# No fixed resolver and no port-53 listener are injected by this template.
# respect-rules is intentionally not enabled blindly: verify bootstrap reachability,
# the actual DNS transport route and the current core's requirements first.
# Disabling AAAA responses would not disable native OS IPv6 or prove isolation.
dns:
  enable: true
